<div class="header-action">
  <div>
    <h1>Users Management</h1>
    <p>Manage administrators, librarians, and students.</p>
  </div>
  <button class="btn btn-primary" (click)="toggleAddForm()" *ngIf="!showAddForm">
    + Add Staff Member
  </button>
</div>

<!-- Tabs for switching views -->
<div class="tabs" *ngIf="!showAddForm">
  <button class="tab-btn" [class.active]="activeTab === 'staff'" (click)="setTab('staff')">Staff</button>
  <button class="tab-btn" [class.active]="activeTab === 'students'" (click)="setTab('students')">Students</button>
</div>

<!-- Add User Form -->
<div class="card form-card" *ngIf="showAddForm">
  <h2>Add New Staff Member</h2>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" formControlName="firstName" placeholder="John">
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" formControlName="lastName" placeholder="Doe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="john@library.com">
      </div>
      <div class="form-group">
        <label>Temporary Password</label>
        <input type="password" formControlName="password" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select formControlName="role">
          <option value="LIBRARIAN">Librarian</option>
          <option value="ADMIN">Administrator</option>
        </select>
      </div>
    </div>
    
    <div class="form-actions">
      <button type="button" class="btn btn-outline" (click)="toggleAddForm()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">Save User</button>
    </div>
  </form>
</div>

<!-- Data Tables -->
<div class="table-container" *ngIf="!showAddForm">
  
  <!-- Staff Table -->
  <table *ngIf="activeTab === 'staff'">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Admin User</td>
        <td>admin@library.com</td>
        <td><span class="badge badge-admin">ADMIN</span></td>
        <td>Active</td>
      </tr>
      <tr>
        <td>Librarian One</td>
        <td>lib1@library.com</td>
        <td><span class="badge badge-lib">LIBRARIAN</span></td>
        <td>Active</td>
      </tr>
    </tbody>
  </table>

  <!-- Students Table -->
  <table *ngIf="activeTab === 'students'">
    <thead>
      <tr>
        <th>Student Name</th>
        <th>Email</th>
        <th>Major</th>
        <th>Card Printed</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Student Test</td>
        <td>student@test.com</td>
        <td>Computer Science</td>
        <td><span class="status-no">No</span></td>
        <td><button class="btn btn-primary btn-small">Print Card</button></td>
      </tr>
    </tbody>
  </table>
</div>
