<div class="dashboard-header">
  <h1>Dashboard Overview</h1>
  <p>Welcome back, Admin. Here is what's happening in the library today.</p>
</div>

<div class="stats-grid">
  <div class="stat-card card">
    <div class="stat-icon books-icon">B</div>
    <div class="stat-info">
      <h3>Total Books</h3>
      <p class="stat-value">{{ totalBooks }}</p>
    </div>
  </div>

  <div class="stat-card card">
    <div class="stat-icon loans-icon">L</div>
    <div class="stat-info">
      <h3>Active Loans</h3>
      <p class="stat-value">{{ activeLoans }}</p>
    </div>
  </div>

  <div class="stat-card card">
    <div class="stat-icon students-icon">S</div>
    <div class="stat-info">
      <h3>Registered Students</h3>
      <p class="stat-value">{{ totalStudents }}</p>
    </div>
  </div>
</div>
