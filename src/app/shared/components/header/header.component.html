<header class="header">
  <div class="header-search">
    <!-- Optional search bar placeholder -->
    <input type="text" placeholder="Search...">
  </div>

  <div class="header-actions">
    <div class="user-profile" *ngIf="currentUser">
      <div class="avatar" *ngIf="!currentUser.profileImage">
        <span>{{ currentUser.firstName.charAt(0) }}</span>
      </div>
      <img *ngIf="currentUser.profileImage" [src]="getProfileImageUrl(currentUser.profileImage)" alt="Profile" class="avatar-img">
      
      <div class="user-info">
        <span class="user-name">{{ currentUser.firstName }} {{ currentUser.lastName }}</span>
        <span class="user-role">{{ currentUser.role }}</span>
      </div>
    </div>
    
    <button class="btn btn-primary" *ngIf="currentUser" (click)="openProfileModal()" style="margin-right: 12px;">
      Edit Profile
    </button>
    <button class="btn btn-outline logout-btn" (click)="onLogout()">
      Logout
    </button>
  </div>
</header>

<!-- Edit Profile Modal -->
<div class="modal-overlay" *ngIf="isProfileModalOpen" (click)="closeProfileModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Edit Profile</h2>
      <button class="btn-close" (click)="closeProfileModal()">×</button>
    </div>
    
    <div class="modal-body">
      <!-- Profile Image Upload Section -->
      <div class="profile-upload-section" style="text-align: center; margin-bottom: 24px;">
        <div class="avatar-preview" style="width: 100px; height: 100px; border-radius: 50%; overflow: hidden; margin: 0 auto 16px; border: 3px solid var(--primary-color);">
          <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview" style="width: 100%; height: 100%; object-fit: cover;">
          <div *ngIf="!imagePreview" style="width: 100%; height: 100%; background: #E2E8F0; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #94A3B8;">
            {{ profileData.firstName.charAt(0) || '?' }}
          </div>
        </div>
        <input type="file" id="profileImageInput" (change)="onFileSelected($event)" accept="image/*" style="display: none;">
        <label for="profileImageInput" class="btn btn-outline" style="cursor: pointer; display: inline-block;">
          <i class="fas fa-camera"></i> Change Photo
        </label>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" class="modern-input" [(ngModel)]="profileData.firstName">
        </div>
        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" class="modern-input" [(ngModel)]="profileData.lastName">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="modern-input" [(ngModel)]="profileData.email">
        </div>
        
        <div class="form-group">
          <label>Role</label>
          <input type="text" class="modern-input" [value]="currentUser?.role" disabled style="background-color: #F1F5F9; cursor: not-allowed;">
        </div>
      </div>
      <small style="color: #64748B; font-size: 11px; text-align: center; display: block; margin-top: -4px;">Your role cannot be changed.</small>
    </div>
    
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closeProfileModal()">Cancel</button>
      <button class="btn btn-primary" (click)="saveProfile()" [disabled]="isUploading">
        {{ isUploading ? 'Saving...' : 'Save Profile' }}
      </button>
    </div>
  </div>
</div>
